name: CI

# Cross-platform matrix. The macOS and Windows runners are what actually
# exercise the per-OS *live gathers* (Get-WinEvent / Get-PnpDevice /
# netsh on Windows, the native macOS tools) — the Linux-only unit run
# would never catch a wrong command shape there. Pure parsers run on
# every leg.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Test
        run: pytest -q
