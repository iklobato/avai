<!doctype html>
<html lang="{{ post.language_code or 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ post.title }}</title>
  {% if post.meta_description %}<meta name="description" content="{{ post.meta_description }}">{% endif %}
  {% if post.meta_keywords %}<meta name="keywords" content="{{ post.meta_keywords }}">{% endif %}
  <style>
    body { max-width: 760px; margin: 2rem auto; padding: 0 1rem;
           font-family: system-ui, -apple-system, sans-serif; line-height: 1.65; color: #1a1a1a; }
    h1 { line-height: 1.2; font-size: 2rem; }
    img { max-width: 100%; height: auto; border-radius: 8px; }
    .hero { margin: 1rem 0 2rem; }
    pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; border-radius: 6px; }
    code { background: #f5f5f5; padding: .1em .3em; border-radius: 4px; }
    a { color: #2563eb; }
    .meta { color: #6b7280; font-size: .9rem; margin-bottom: 1.5rem; }
  </style>
  {% if faq_jsonld %}<script type="application/ld+json">{{ faq_jsonld }}</script>{% endif %}
</head>
<body>
  <article>
    <h1>{{ post.title }}</h1>
    {% if post.published_at %}<p class="meta">{{ post.published_at }}</p>{% endif %}
    {% if hero %}<img class="hero" src="{{ hero }}" alt="{{ post.hero_image_alt or post.title }}">{% endif %}
    {{ content }}
    {% if infographic %}<img src="{{ infographic }}" alt="{{ post.title }} infographic">{% endif %}
  </article>
</body>
</html>
