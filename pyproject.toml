[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"


[project]
# PyPI distribution name. The import name and CLI entry point both
# stay `avai`; only the install name (`pip install avai-monitor`)
# differs, because the canonical `avai` slot is blocked by PyPI's
# name-similarity policy.
name = "avai-monitor"
version = "0.7.3"
description = "macOS / Linux host-security telemetry collector with an LLM threat judge and a single-page web dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "iklo", email = "tiktachack@gmail.com" },
]
keywords = [
    "security",
    "monitoring",
    "macos",
    "linux",
    "audit",
    "edr",
    "llm",
    "threat-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "psutil>=5.9",
    "sqlalchemy>=2.0",
    "flask>=3.0",
    "requests>=2.31",
    # Production WSGI server for the dashboard (pure-Python, cross-platform)
    # so `avai dashboard` doesn't run on Werkzeug's dev server.
    "waitress>=3.0",
    # Schema migrations (indexes / future changes) applied on monitor startup
    # and via `avai migrate`.
    "alembic>=1.13",
    # HTML/Markdown rendering for the dashboard narrative and the AutoSEO blog.
    # Without these, render_markdown and the blog's _safe_html silently fall
    # back to escaping — article HTML renders as literal text in production.
    "markdown>=3.5",
    "bleach>=6.0",
    # YARA signature scanning (FileScanCollector). Wheels bundle libyara for
    # manylinux + macOS, so no separate system install is needed on those.
    "yara-python>=4.5",
    # The LLM threat judge is core, so its providers ship by default — a plain
    # `pip install avai-monitor` runs the judge (you still supply an API key /
    # OAuth token at runtime; without one it falls back to NullJudge).
    "litellm>=1.0",
    "anthropic>=0.30",
]

[project.optional-dependencies]
# Desktop app (`avai app`): native window via the OS webview. Kept out of the
# base install so a headless monitor/dashboard stays GUI-free.
app = [
    "pywebview>=5.0",
]
dev = [
    "build>=1.0",
    "twine>=5.0",
    "pytest>=7.0",
]

[project.scripts]
avai = "avai.cli:main"

[project.urls]
Homepage = "https://github.com/iklobato/avai"
Repository = "https://github.com/iklobato/avai"
Issues = "https://github.com/iklobato/avai/issues"


# -----------------------------------------------------------------------------
# Hatchling build config — include the package data (prompts.toml,
# templates/, static/) in both wheel and sdist.
# -----------------------------------------------------------------------------

# The full YARA pack (rules/vendor/) is fetched onto the build host by
# scripts/update_rules.py and is VCS-ignored, so hatchling skips it by default.
# `artifacts` force-includes it so the published wheel/sdist ships the whole
# ruleset (signature-base), not just the bundled EICAR rule. The pack is
# mixed-license (see rules/vendor/.../LICENSE + the NOTICE file) and some rules
# need a crypto-enabled yara to compile; both are tolerated at load time.
[tool.hatch.build]
artifacts = ["src/avai/rules/vendor/**"]

[tool.hatch.build.targets.wheel]
# packages = ["src/avai"] is enough — hatchling walks the directory
# and includes every file (Python and otherwise), so prompts.toml,
# templates/, static/, and the rules/ tree end up under avai/ in the wheel.
packages = ["src/avai"]

[tool.hatch.build.targets.sdist]
include = [
    "src/avai/**",
    "README.md",
    "Dockerfile",
    "docker-compose.yml",
    "pyproject.toml",
]
exclude = ["src/avai/rules/vendor/**"]
